<?xml version="1.0" encoding="UTF-8"?>
<svg width="2480" height="1754" viewBox="0 0 2480 1754" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Metadata -->
  <metadata>
    Casa Modelo: 1 Quarto + Closet — Conceitual (ObraMétrica)
    License: CC BY 4.0
  </metadata>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Scale & frame -->
  <g id="frame" transform="translate(120,80)">
    <!-- Outer boundary (for sheet) -->
    <rect x="0" y="0" width="2240" height="1594" fill="none" stroke="#e6e6e6" stroke-width="1"/>
  </g>

  <!-- Drawing group (walls, doors, windows, furniture) -->
  <g id="drawing" transform="translate(200,120)">
    <!-- Unit cell scale: assume overall plan area ~ 1200 x 900 on canvas -->
    <!-- Main walls (outer) -->
    <rect x="0" y="0" width="1200" height="820" fill="none" stroke="#111" stroke-width="8"/>

    <!-- Internal walls -->
    <!-- Bedroom + closet area (left top) -->
    <rect x="20" y="20" width="460" height="360" fill="none" stroke="#111" stroke-width="6"/>
    <!-- Closet inside bedroom (top-left corner) -->
    <rect x="320" y="28" width="140" height="120" fill="#f7f7f7" stroke="#111" stroke-width="3"/>
    <text x="335" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333">Closet</text>

    <!-- Living + kitchen open (right side) -->
    <rect x="500" y="20" width="680" height="420" fill="none" stroke="#111" stroke-width="6"/>
    <!-- Kitchen counter (right top) -->
    <rect x="540" y="40" width="320" height="80" fill="#fafafa" stroke="#888" stroke-width="2"/>
    <text x="610" y="90" font-family="Arial" font-size="18" fill="#444">Cozinha</text>

    <!-- Island / dining -->
    <rect x="900" y="80" width="160" height="60" rx="8" fill="#fff" stroke="#888" stroke-width="2"/>
    <text x="920" y="115" font-family="Arial" font-size="16" fill="#444">Ilha</text>

    <!-- Living area (sofa + TV) -->
    <rect x="560" y="160" width="420" height="180" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <rect x="580" y="180" width="200" height="60" fill="#e9e9e9" stroke="#bbb" stroke-width="1"/>
    <text x="590" y="205" font-family="Arial" font-size="16" fill="#333">Sofá</text>
    <rect x="820" y="210" width="120" height="40" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <text x="835" y="235" font-family="Arial" font-size="14" fill="#333">Rack/TV</text>

    <!-- Circulation and bathroom -->
    <rect x="20" y="400" width="360" height="160" fill="none" stroke="#111" stroke-width="6"/>
    <text x="40" y="440" font-family="Arial" font-size="18" fill="#333">Banheiro</text>

    <!-- Lavanderia (adjacent) -->
    <rect x="420" y="460" width="180" height="120" fill="none" stroke="#111" stroke-width="6"/>
    <text x="440" y="520" font-family="Arial" font-size="16" fill="#333">Lavanderia</text>

    <!-- Small service/technical veranda -->
    <rect x="620" y="460" width="240" height="120" fill="none" stroke="#111" stroke-width="6"/>
    <text x="640" y="520" font-family="Arial" font-size="16" fill="#333">Varanda técnica</text>

    <!-- Entry (bottom-left) -->
    <rect x="20" y="580" width="200" height="200" fill="none" stroke="#111" stroke-width="6"/>
    <text x="40" y="650" font-family="Arial" font-size="16" fill="#333">Entrada</text>

    <!-- Doors (swing arcs) -->
    <!-- Bedroom door (swing into bedroom from corridor) -->
    <path d="M 480 200 A 40 40 0 0 1 520 160" stroke="#111" fill="none" stroke-width="3"/>
    <!-- Bathroom door -->
    <path d="M 380 460 A 36 36 0 0 1 416 424" stroke="#111" fill="none" stroke-width="3"/>
    <!-- Laundry door -->
    <path d="M 420 520 A 28 28 0 0 1 448 492" stroke="#111" fill="none" stroke-width="3"/>
    <!-- Entry door -->
    <path d="M 200 740 A 44 44 0 0 1 244 696" stroke="#111" fill="none" stroke-width="3"/>

    <!-- Windows (thin rectangles) -->
    <rect x="20" y="120" width="12" height="120" fill="#7fbce5" stroke="#1a8abf" stroke-width="1"/>
    <rect x="1188" y="120" width="12" height="140" fill="#7fbce5" stroke="#1a8abf" stroke-width="1"/>

    <!-- Text labels for rooms -->
    <text x="40" y="60" font-family="Arial" font-size="24" fill="#000">Quarto</text>
    <text x="520" y="60" font-family="Arial" font-size="24" fill="#000">Sala / Cozinha</text>
    <text x="40" y="440" font-family="Arial" font-size="20" fill="#000">Banheiro social</text>

    <!-- Furniture suggestions (beds, fixtures) -->
    <rect x="40" y="100" width="220" height="140" fill="#f4f4f4" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="170" font-family="Arial" font-size="14" fill="#666">Cama casal</text>

    <!-- Fixtures in bathroom -->
    <rect x="280" y="420" width="60" height="30" fill="#fff" stroke="#888" stroke-width="1"/>
    <text x="282" y="440" font-family="Arial" font-size="12" fill="#444">Bancada</text>

    <!-- Dimension hints (indicative) -->
    <text x="10" y="900" font-family="Arial" font-size="14" fill="#777">Escala indicativa: 1:100 (ajustar conforme projeto)</text>

    <!-- Border for plan area -->
    <rect x="-10" y="-10" width="1220" height="840" fill="none" stroke="#ddd" stroke-width="2"/>
  </g>

  <!-- Footer with license and disclaimer -->
  <g id="footer" transform="translate(200,980)">
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#222">
      Modelo conceitual — consulte profissional habilitado antes de construir.
    </text>
    <text x="0" y="44" font-family="Arial" font-size="12" fill="#666">
      Licença: CC BY 4.0 — Atribuir: "ObraMétrica (modelo conceitual)". Mais em https://creativecommons.org/licenses/by/4.0/
    </text>
  </g>
</svg>
